; Configuración de PlatformIO
;
; Hay dos envs para el Arduino Nano, uno por cada tipo de buzzer (los dos en PB2):
;   nano_activo : buzzer ACTIVO (trae su propio oscilador; sólo prende/apaga).
;   nano_pasivo : buzzer PASIVO (el micro genera el tono: notas y sonido de motor).
; Y uno "native" que compila la lógica del juego en la PC para correr los tests:
;   pio test -e native

[platformio]
default_envs = nano_activo

[nano_comun]
platform = atmelavr
board = nanoatmega328new
framework = arduino
test_ignore = *

[env:nano_activo]
extends = nano_comun
build_flags = -D BUZZER_ACTIVO

[env:nano_pasivo]
extends = nano_comun
build_flags = -D BUZZER_PASIVO

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ignore = tira, display, temporizador, sonido, efectos
